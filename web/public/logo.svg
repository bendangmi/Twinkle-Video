<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Twinkle Video</title>
  <desc id="desc">银色 T 与金色 V 组成的 Twinkle Video 标志</desc>
  <defs>
    <radialGradient id="background" cx="50%" cy="42%" r="72%">
      <stop offset="0" stop-color="#161616"/>
      <stop offset="0.7" stop-color="#050505"/>
      <stop offset="1"/>
    </radialGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#777"/>
      <stop offset="0.18" stop-color="#fff"/>
      <stop offset="0.47" stop-color="#9d9d9d"/>
      <stop offset="0.72" stop-color="#f4f4f4"/>
      <stop offset="1" stop-color="#555"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3a8"/>
      <stop offset="0.28" stop-color="#ffd84f"/>
      <stop offset="0.62" stop-color="#f3a414"/>
      <stop offset="1" stop-color="#8b4a00"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8f8f8"/>
      <stop offset="0.55" stop-color="#b6b6b6"/>
      <stop offset="0.75" stop-color="#ffd54b"/>
      <stop offset="1" stop-color="#d57b00"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="12" dy="18" stdDeviation="14" flood-color="#000" flood-opacity="0.85"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="176" fill="url(#background)"/>
  <ellipse cx="524" cy="797" rx="246" ry="22" fill="#f5aa19" opacity="0.3" filter="url(#glow)"/>
  <g filter="url(#shadow)">
    <path d="M174 255 634 255 585 341 436 341 355 704 237 704 315 341 126 341Z" fill="url(#silver)" stroke="#f7f7f7" stroke-width="7" stroke-linejoin="round"/>
    <path d="M429 380 533 380 612 626 744 334 864 334 658 730 548 730Z" fill="url(#gold)" stroke="#fff0a0" stroke-width="7" stroke-linejoin="round"/>
  </g>
  <path d="M169 516C72 628 137 765 331 808 527 851 748 776 899 608 786 760 588 802 386 778 194 755 124 650 169 516Z" fill="url(#orbit)" stroke="#fff" stroke-opacity="0.32" stroke-width="4"/>
  <path d="M803 172 820 226 870 244 820 260 800 315 784 261 735 244 784 227Z" fill="url(#gold)" stroke="#fff4bb" stroke-width="5"/>
</svg>
